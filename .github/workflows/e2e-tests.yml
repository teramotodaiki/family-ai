name: E2E Tests

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-e2e:
    runs-on: macos-15
    timeout-minutes: 40
    env:
      SCHEME: main
      WORKSPACE: apps/main/ios/main.xcworkspace
      CONFIG: Debug
      DERIVED_DATA: apps/main/build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java 17 (Maestro requirement)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies (root)
        run: npm ci

      - name: Install IDB companion (iOS requirement)
        run: |
          brew tap facebook/fb
          brew install idb-companion

      - name: Install Maestro CLI
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Resolve Xcode/SDK versions
        id: versions
        run: |
          echo "xcode=$(xcodebuild -version | tr '\n' ' ' | sed 's/  */ /g')" >> "$GITHUB_OUTPUT"
          echo "iossdk=$(xcrun --sdk iphonesimulator --show-sdk-version)" >> "$GITHUB_OUTPUT"

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            apps/main/ios/Pods
            ~/Library/Caches/CocoaPods
            ~/.cocoapods
          key: ${{ runner.os }}-pods-${{ steps.versions.outputs.iossdk }}-${{ hashFiles('apps/main/ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-${{ steps.versions.outputs.iossdk }}-
            ${{ runner.os }}-pods-

      - name: Install CocoaPods
        working-directory: apps/main/ios
        run: pod install --repo-update

      - name: Cache DerivedData
        id: cache-derived
        uses: actions/cache@v4
        with:
          path: ${{ env.DERIVED_DATA }}
          key: ${{ runner.os }}-derived-${{ steps.versions.outputs.xcode }}-${{ steps.versions.outputs.iossdk }}-${{ hashFiles('apps/main/ios/Podfile.lock', 'apps/main/package-lock.json', 'apps/main/package.json', 'apps/main/app.json', 'apps/main/app.config.*') }}
          restore-keys: |
            ${{ runner.os }}-derived-${{ steps.versions.outputs.xcode }}-${{ steps.versions.outputs.iossdk }}-
            ${{ runner.os }}-derived-

      - name: Build iOS .app (skip if cache hit)
        env:
          NSUnbufferedIO: "YES"
        run: |
          # If an app already exists in DerivedData after cache restore, skip building.
          APP_GLOB="${DERIVED_DATA}/Build/Products/${CONFIG}-iphonesimulator/*.app"
          if compgen -G "$APP_GLOB" > /dev/null; then
            echo "Found cached .app -> skip xcodebuild"
          else
            echo "No cached .app -> building with xcodebuild"
            xcodebuild \
              -workspace "$WORKSPACE" \
              -scheme "$SCHEME" \
              -configuration "$CONFIG" \
              -sdk iphonesimulator \
              -destination 'generic/platform=iOS Simulator' \
              -derivedDataPath "$DERIVED_DATA" \
              -UseModernBuildSystem=YES \
              build | tee xcodebuild.log
          fi

      - name: Boot iOS Simulator
        run: $HOME/.maestro/bin/maestro start-device --platform ios

      - name: Install app and run E2E tests
        working-directory: apps/main
        env:
          EXPO_PUBLIC_OPENAI_API_KEY: ${{ secrets.EXPO_PUBLIC_OPENAI_API_KEY }}
        run: |
          # Find .app file in multiple possible locations (prefer cached DerivedData path)
          APP_PATH=""
          for search_path in "$GITHUB_WORKSPACE/${DERIVED_DATA}" ~/Library/Developer/Xcode/DerivedData ios/build; do
            APP_PATH="$(find "$search_path" -name "*.app" -path "*/Build/Products/Debug-iphonesimulator/*" 2>/dev/null | head -n 1)"
            if [ -n "$APP_PATH" ]; then
              break
            fi
          done
          if [ -z "$APP_PATH" ]; then
            echo "Error: Could not find .app file in any expected location"
            echo "Searching in all possible locations..."
            find ~ -name "*.app" -path "*/Debug-iphonesimulator/*" 2>/dev/null || true
            exit 1
          fi
          echo "Installing app: $APP_PATH"
          xcrun simctl install booted "$APP_PATH"
          $HOME/.maestro/bin/maestro test maestro --format junit --test-output-dir=artifacts

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maestro-ios-artifacts
          path: |
            apps/main/artifacts/**
            apps/main/report.xml
